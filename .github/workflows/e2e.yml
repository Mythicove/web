name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: playwright full-stack
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mirror
          POSTGRES_PASSWORD: mirror
          POSTGRES_DB: mirror_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mirror"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025
          - 1025:1025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Mythicove/mythic-mirror
          path: mirror
      - uses: actions/checkout@v4
        with:
          repository: Mythicove/mythic-hoard
          path: hoard
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: |
            mirror/go.sum
            hoard/go.sum
      - name: create hoard database
        run: PGPASSWORD=mirror psql -h localhost -U mirror -d postgres -c "CREATE DATABASE hoard_e2e OWNER mirror;"
      - name: build mirror
        working-directory: mirror
        env:
          GOPRIVATE: github.com/Mythicove/*
        run: go build -o /tmp/mirror-server ./cmd/server
      - name: build hoard
        working-directory: hoard
        env:
          GOPRIVATE: github.com/Mythicove/*
        run: go build -o /tmp/hoard-server ./cmd/server
      - name: start reverse proxy (single API domain)
        run: |
          docker run -d --name e2e-caddy --network host \
            -v ${{ github.workspace }}/e2e/Caddyfile:/etc/caddy/Caddyfile:ro \
            --add-host host.docker.internal:$(hostname -i) \
            caddy:2-alpine
          # caddy proxies to mirror which starts later: any HTTP response (even 502) proves caddy is up
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8090/ && echo "caddy up" && break || sleep 1; done
          curl -s -o /dev/null http://localhost:8090/ || { echo "caddy failed to start"; docker logs e2e-caddy; exit 1; }
      - name: start mirror
        run: |
          MIRROR_LISTEN_ADDR=:18080 \
          MIRROR_DATABASE_URL='postgres://mirror:mirror@localhost:5432/mirror_e2e?sslmode=disable' \
          MIRROR_KEY_PATH=/tmp/mirror-key.pem \
          MIRROR_TEXTURES_DIR=/tmp/mirror-tex \
          MIRROR_MAIL_DRIVER=smtp \
          MIRROR_SMTP_ADDR=localhost:1025 \
          MIRROR_SMTP_FROM=mirror@e2e.local \
          MIRROR_WEB_URL=http://localhost:3110 \
          MIRROR_BASE_URL=http://localhost:8090 \
          MIRROR_ADMIN_TOKEN=e2e-admin \
          MIRROR_CORS_ORIGINS=http://localhost:3110 \
          nohup /tmp/mirror-server > /tmp/mirror.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:18080/healthz >/dev/null && echo "mirror up" && break || sleep 1; done
          curl -sf http://localhost:18080/healthz >/dev/null || { echo "mirror failed to start"; cat /tmp/mirror.log; exit 1; }
      - name: register hoard OIDC client
        run: |
          SECRET_HASH=$(printf 'hoard-e2e-secret' | sha256sum | cut -d' ' -f1)
          curl -sf -X POST http://localhost:18080/api/admin/oauth-clients \
            -H 'Authorization: Bearer e2e-admin' -H 'Content-Type: application/json' \
            -d "{\"id\":\"hoard-e2e\",\"name\":\"Hoard E2E\",\"secret_hash\":\"$SECRET_HASH\",\"redirect_uris\":[\"http://localhost:8090/auth/oidc/callback\"],\"grant_types\":[\"authorization_code\",\"refresh_token\"],\"scopes\":[\"openid\",\"profile\",\"email\"],\"public\":false,\"first_party\":true}"
      - name: start hoard
        run: |
          HOARD_LISTEN_ADDR=:18081 \
          HOARD_BASE_URL=http://localhost:8090 \
          HOARD_DATABASE_URL='postgres://mirror:mirror@localhost:5432/hoard_e2e?sslmode=disable&options=-csearch_path%3Dhoard' \
          HOARD_DATA_DIR=/tmp/hoard-files \
          HOARD_ADMIN_TOKEN=e2e-hoard-admin \
          HOARD_OIDC_ISSUER=http://localhost:8090 \
          HOARD_OIDC_CLIENT_ID=hoard-e2e \
          HOARD_OIDC_CLIENT_SECRET=hoard-e2e-secret \
          HOARD_OIDC_REDIRECT_URL=http://localhost:8090/auth/oidc/callback \
          HOARD_OIDC_INTERNAL_BASE_URL=http://localhost:18080 \
          HOARD_CORS_ORIGINS=http://localhost:3110 \
          nohup /tmp/hoard-server > /tmp/hoard.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:18081/healthz >/dev/null && echo "hoard up" && break || sleep 1; done
          curl -sf http://localhost:18081/healthz >/dev/null || { echo "hoard failed to start"; cat /tmp/hoard.log; exit 1; }
      - name: start fake cap siteverify
        run: |
          # 假的 Cap Standalone siteverify（只认 JSON 体 + 约定 secret/token），
          # 让 captcha.spec.ts 能在 CI 里验证"验证码被真正强制校验"
          nohup node e2e/fixtures/fake-cap-siteverify.mjs > /tmp/fake-cap.log 2>&1 &
          for i in $(seq 1 20); do curl -s -o /dev/null -X POST http://localhost:18099/ && echo "fake cap up" && break || sleep 1; done
          curl -s -o /dev/null -X POST http://localhost:18099/ || { echo "fake cap failed to start"; cat /tmp/fake-cap.log; exit 1; }
      - name: start mirror (captcha enabled)
        run: |
          MIRROR_LISTEN_ADDR=:18082 \
          MIRROR_KEY_PATH=/tmp/mirror-cap-key.pem \
          MIRROR_TEXTURES_DIR=/tmp/mirror-cap-tex \
          MIRROR_MAIL_DRIVER=smtp \
          MIRROR_SMTP_ADDR=localhost:1025 \
          MIRROR_SMTP_FROM=mirror@e2e.local \
          MIRROR_WEB_URL=http://localhost:3110 \
          MIRROR_BASE_URL=http://localhost:18082 \
          MIRROR_CAPTCHA_DRIVER=cap \
          MIRROR_CAPTCHA_SITE_KEY=e2e-cap-site-key \
          MIRROR_CAPTCHA_SECRET=e2e-cap-secret \
          MIRROR_CAPTCHA_CAP_URL=http://localhost:18099 \
          nohup /tmp/mirror-server > /tmp/mirror-cap.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:18082/healthz >/dev/null && echo "mirror(cap) up" && break || sleep 1; done
          curl -sf http://localhost:18082/healthz >/dev/null || { echo "mirror(cap) failed to start"; cat /tmp/mirror-cap.log; exit 1; }
      - name: start mirror (captcha misconfigured)
        run: |
          # 故意缺 SECRET 与 CAP_URL：验证码实例建不起来，注册必须 503 而不是静默放行
          MIRROR_LISTEN_ADDR=:18083 \
          MIRROR_KEY_PATH=/tmp/mirror-broken-key.pem \
          MIRROR_TEXTURES_DIR=/tmp/mirror-broken-tex \
          MIRROR_MAIL_DRIVER=smtp \
          MIRROR_SMTP_ADDR=localhost:1025 \
          MIRROR_SMTP_FROM=mirror@e2e.local \
          MIRROR_WEB_URL=http://localhost:3110 \
          MIRROR_BASE_URL=http://localhost:18083 \
          MIRROR_CAPTCHA_DRIVER=cap \
          MIRROR_CAPTCHA_SITE_KEY=e2e-cap-site-key \
          nohup /tmp/mirror-server > /tmp/mirror-broken.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:18083/healthz >/dev/null && echo "mirror(broken captcha) up" && break || sleep 1; done
          curl -sf http://localhost:18083/healthz >/dev/null || { echo "mirror(broken) failed to start"; cat /tmp/mirror-broken.log; exit 1; }
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build web
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8090"
      - name: start web
        run: |
          # next.config.ts 是 output: standalone —— `next start` 会直接拒绝启动，
          # 必须跑 standalone server，并手动补齐它不打包的静态资源（.next/static 与 public）。
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          # 探针必须带浏览器 UA：非索引部署默认 BLOCK_BOTS=true，curl/ 会被 403 拦掉。
          # 这里刻意保留 BLOCK_BOTS 默认值，让 e2e 跑在真实配置下
          # （Playwright 的 HeadlessChrome UA 不在黑名单里，测试本身不受影响）。
          # 不要设 HOSTNAME：与探针/浏览器使用的主机名不一致时，next-intl 的内部 rewrite
          # 会变成绝对 URL，Next 遂改为外部 308 → /login 自我重定向死循环。
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          API_URL_INTERNAL=http://localhost:8090 PORT=3110 \
            nohup node .next/standalone/server.js > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -A "$UA" http://localhost:3110/login >/dev/null && echo "web up" && break || sleep 1; done
          curl -sf -A "$UA" http://localhost:3110/login >/dev/null || { echo "web failed to start"; cat /tmp/web.log; exit 1; }
      - name: install browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: run e2e
        run: pnpm exec playwright test
      - name: upload logs on failure
        if: failure()
        run: |
          cp /tmp/mirror.log /tmp/hoard.log /tmp/web.log /tmp/fake-cap.log /tmp/mirror-cap.log /tmp/mirror-broken.log test-results/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
