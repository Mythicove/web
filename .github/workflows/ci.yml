name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: typecheck & lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Mythicove/api
          path: api-specs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: generate api types
        run: pnpm gen:api
        env:
          API_SPECS_DIR: ${{ github.workspace }}/api-specs/specs
      - name: check api types drift
        run: git diff --exit-code src/lib/api-schema
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: stylelint
        run: pnpm stylelint
      - name: build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8080"
